l_english:
 communism: "Communism"
 communism_noun: "Communist"
 communism_desc: "Communist Government\n§LCommunism (from Latin communis 'common, universal') is a political and economic ideology whose goal is the creation of a communist society, a socioeconomic classless order centered on common ownership of the means of production, distribution, and exchange that allocates products in society based on need. A communist society entails the absence of private property and social classes, and ultimately money and the state. Communists often seek a voluntary state of self-governance but disagree on the means to this end. This reflects a distinction between a libertarian socialist approach of communization, revolutionary spontaneity, and workers' self-management, and an authoritarian socialist, vanguardist, or party-driven approach to establish a socialist state, which is expected to wither away. There are many variants of communism, such as anarchist communism, Marxist schools of thought (including Leninism and its offshoots), and religious communism. These ideologies share the analysis that the current order of society stems from the capitalist economic system and mode of production; they believe that there are two major social classes under capitalism, that the relationship between them is exploitative, and that it can only be resolved through social revolution. The two classes under capitalism are the proletariat (working class), who make up most of the population and sell their labor power to survive, and the bourgeoisie (owning class), a minority that derives profit from employing the proletariat through private ownership of the means of production. Some variants additionally emphasize feudal classes, such as the peasantry and feudal lords, or other classes. According to this, a communist revolution would put the working class in power, and establish common ownership of property, the primary element in the transformation of society towards a socialist mode of production. Communism in its modern form grew out of the socialist movement in 19th-century Europe that argued capitalism caused the misery of urban factory workers. In 1848, Karl Marx and Friedrich Engels offered a new definition of communism in The Communist Manifesto. In the 20th century, Communist governments espousing Marxism–Leninism came to power, first in the Soviet Union with the 1917 Russian Revolution, then in Eastern Europe, Asia, and other regions after World War II. By the 1920s, communism had become one of the two dominant types of socialism in the world, the other being social democracy. Communist parties have been described as radical left or far-left. For much of the 20th century, more than one-third of the world's population lived under Communist governments. These were characterized by one-party rule, rejection of private property and capitalism, state control of economic activity and mass media, restrictions on freedom of religion, and suppression of opposition. With the dissolution of the Soviet Union in 1991, many governments abolished Communist rule. Only a few nominally Communist governments remain, such as China, Cuba, Laos, North Korea, and Vietnam. Except for North Korea, these have allowed more economic competition while maintaining one-party rule. Communism's decline has been attributed to economic inefficiency and to authoritarianism and bureaucracy within Communist governments. Although the emergence of the Soviet Union as the first state based on Marxism–Leninism led to socialism becoming widely associated with the Soviet economic model, several scholars argue that in practice this model functioned as a form of state capitalism. Public memory of 20th-century Marxist-Leninist states has been described as a battleground between anti-communism and anti anti-communism. Authors have written about mass killings under communist regimes and mortality rates, which remain controversial, polarized, and debated topics in academia, historiography, and politics when discussing communism and the legacy of Marxist-Leninist states. From the 1990s, many Communist parties adopted democratic principles and came to share power with others in government, such as the CPN UML and the Nepal Communist Party, which support People's Multiparty Democracy in Nepal§!"
 marxist: "Marxist"
 marxist_desc: "Marxist Government\n§LMarxism is a political philosophy and method of socioeconomic analysis that uses a dialectical materialist interpretation of historical development, known as historical materialism, to understand class relations and social conflict. Originating in the works of 19th-century German philosophers Karl Marx and Friedrich Engels, the Marxist approach views class struggle as the central driving force of historical change. Marxist analysis views a society's economic mode of production as the foundation of its social, political, and intellectual life, a concept known as the base and superstructure model. In its critique of capitalism, Marxism posits that the ruling class (the bourgeoisie), who own the means of production, systematically exploit the working class (the proletariat), who must sell their labour power to survive. This relationship, according to Marx, leads to alienation, periodic economic crises, and escalating class conflict. Marx theorised that these internal contradictions would fuel a proletarian revolution, leading to the overthrow of capitalism and the establishment of a socialist mode of production. For Marxists, this transition represents a necessary step towards a classless, stateless communist society. Since Marx's death, his ideas have been elaborated and adapted by numerous thinkers and political movements, resulting in a wide array of schools of thought. The most prominent of these in the 20th century was Marxism–Leninism, which was developed after Vladimir Lenin's death and served as the official ideology of the Soviet Union and other Marxist states. In contrast, various academic and dissident traditions, including Western Marxism, Marxist humanism, Marxist feminism, and libertarian Marxism, have emerged, often critical of state socialism and focused on aspects like culture, philosophy, and individual liberty. This diverse evolution means there is no single, definitive Marxist theory. Marxism stands as one of the most influential and controversial intellectual traditions in modern history. It has inspired revolutions, social movements, and political parties across the world, while also shaping numerous academic disciplines. Marxist concepts such as alienation, exploitation, and class struggle have become integral to the social sciences and humanities, influencing fields from sociology and literary criticism to political science and cultural studies. The interpretation and implementation of Marxist ideas remain subjects of intense debate, both politically and academically.§!"
 marxist_leninist: "Marxist-Leninist"
 marxist_leninist_desc: "Marxist-Leninist Government\n§LMarxism–Leninism is a communist ideology that became the largest faction of the communist movement following the October Revolution. It was the predominant ideology of most communist governments in the 20th century. It was developed in the Soviet Union by Joseph Stalin and drew on Bolshevism, Leninism, and Classical Marxism. It was the state ideology of the Soviet Union, Soviet satellite states in the Eastern Bloc, and various countries in the Non-Aligned Movement and Third World during the Cold War, as well as the Communist International. It is the ideology of the ruling parties of China, Cuba, Laos, and Vietnam, as well as other communist parties. The state ideology of North Korea is derived from Marxism–Leninism. Marxism–Leninism holds that a two-stage communist revolution is needed to replace capitalism. A vanguard party, organized through democratic centralism, seizes power on behalf of the proletariat and establishes a one-party communist state. The state controls the means of production, suppresses opposition, counter-revolution, and the bourgeoisie, and promotes Soviet collectivism, to pave the way for a communist society that is classless and stateless. After Lenin's death in 1924, Marxism–Leninism became a distinct movement in the Soviet Union when Stalin and his supporters gained control of the Communist Party of the Soviet Union (CPSU). It rejected the notion among Western Marxists of world revolution as a prerequisite for building socialism, in favour of the concept of socialism in one country. The transition from capitalism to socialism was signified by the introduction of the first five-year plan and the 1936 Soviet Constitution. By the late 1920s, Stalin established ideological orthodoxy in the CPSU, Soviet Union, and Communist International to establish universal Marxist–Leninist praxis. The formulation of the Soviet version of dialectical and historical materialism by Stalin and his associates, such as in Stalin's text Dialectical and Historical Materialism, became the official Soviet interpretation of Marxism, and was taken as example by Marxist–Leninists in other countries. This text became the foundation philosophy of Marxism–Leninism. In 1938, Stalin's textbook History of the Communist Party of the Soviet Union (Bolsheviks) popularised Marxism–Leninism. The internationalism of Marxism–Leninism was expressed in supporting revolutions in other countries, initially through the Communist International, then through the concepts of national democratic states and states of socialist orientation after de-Stalinisation. The establishment of other communist states after World War II resulted in Sovietisation, and these states tended to follow the Marxist–Leninist model of five-year plans and rapid industrialisation, political centralisation, and repression. During the Cold War, Marxist–Leninist countries like the Soviet Union were a major force in international relations. With the death of Stalin and ensuing de-Stalinisation, Marxism–Leninism underwent revisions and adaptations such as Guevarism, Titoism, Ho Chi Minh Thought, Hoxhaism, and Maoism, with the latter two constituting anti-revisionist Marxism–Leninism. These adaptations caused splits between communist states, resulting in the Tito–Stalin split, the Sino-Soviet split, and the Sino-Albanian split. As the Cold War concluded with the demise of much of the socialist world, many surviving communist states reformed their economies and embraced market socialism. Complementing this economic shift, the Communist Party of China developed Maoism into Deng Xiaoping Theory. Today this comprises part of China's governing ideology, with the latest developments including Xi Jinping Thought. Meanwhile, the Communist Party of Peru developed Maoism into Marxism–Leninism–Maoism. The latest developments to Marxism–Leninism–Maoism include Gonzaloism, Maoism-Third Worldism, National Democracy, and Prachanda Path. Ongoing Marxist–Leninist(–Maoist) insurgencies include those waged in the Philippines, India, and Turkey. The Nepalese Civil War, fought by Marxist–Leninist–Maoists, ended in their victory in 2006. Criticism of Marxism–Leninism overlaps with criticism of communist party rule and focuses on the actions and policies of Marxist–Leninist leaders, notably Stalin and Mao Zedong. Communist states have been marked by centralised state control by the communist party, political repression, state atheism, collectivisation and labour camps. Some historians state that the repression and totalitarianism came from Marxist–Leninist ideology. Others offer different explanations and criticise focus on the upper levels of society, and concepts such as totalitarianism, which obscure the reality of the system. While the emergence of the Soviet Union as the first nominally communist state led to communism's association with Marxism–Leninism and the Soviet model, several academics say that Marxism–Leninism in practice was a form of state capitalism. The socio-economic nature of communist states, especially of the Soviet Union during the Stalin era (1924–53), has been much debated, varyingly being labelled a form of bureaucratic collectivism, state capitalism, state socialism, or a unique mode of production. The Eastern Bloc, including communist states in Central and Eastern Europe as well as the Third World socialist regimes, have been described as \"bureaucratic-authoritarian systems\", and China's socio-economic structure has been referred to as \"nationalistic state capitalism\".§!"
 leninist: "Leninist"
 leninist_desc: "Leninist Government\n§LLeninism is a political ideology developed by Russian Marxist revolutionary Vladimir Lenin that proposes the establishment of the dictatorship of the proletariat led by a revolutionary vanguard party as the political prelude to the establishment of communism. Lenin's ideological contributions to the Marxist ideology relate to his theories on the party, imperialism, the state, and revolution. The function of the Leninist vanguard party was to provide the working classes with the political consciousness (education and organisation) and revolutionary leadership necessary to depose capitalism in the Russian Empire (1721–1917). Leninist revolutionary leadership is based upon The Communist Manifesto (1848), identifying the communist party as \"the most advanced and resolute section of the working class parties of every country; that section which pushes forward all others.\" As the vanguard party, the Bolsheviks viewed history through the theoretical framework of historical materialism, which sanctioned political commitment to the successful overthrow of capitalism, and then to instituting socialism; and, as the revolutionary national government, to realise the socio-economic transition by all means. In the aftermath of the October Revolution (1917), Leninism was the dominant version of Marxism in Russia and the basis of soviet democracy, the rule of directly elected soviets. In establishing the socialist mode of production in Bolshevik Russia—with the Decree on Land (1917), war communism (1918–1921), and the New Economic Policy (1921–1928)—the revolutionary régime suppressed most political opposition, including Marxists who opposed Lenin's actions, the anarchists and the Mensheviks, factions of the Socialist Revolutionary Party and the Left Socialist-Revolutionaries. The Russian Civil War (1917–1922), which included the seventeen-army Allied intervention in the Russian Civil War (1917–1925), and left-wing uprisings against the Bolsheviks (1918–1924), was an external and internal war which transformed Bolshevik Russia into the Russian Socialist Federative Soviet Republic (RSFSR), the core republic of the Union of Soviet Socialist Republics (USSR). As revolutionary praxis, Leninism originally was neither a proper philosophy nor a discrete political theory. Leninism comprises politico-economic developments of orthodox Marxism and Lenin's interpretations of Marxism, which function as a pragmatic synthesis for practical application to the actual conditions (political, social, economic) of the post-emancipation agrarian society of Imperial Russia in the early 20th century. As a political-science term, Lenin's theory of proletarian revolution entered common usage at the fifth congress of the Communist International (1924), when Grigory Zinoviev applied the term Leninism to denote \"vanguard-party revolution.\" Leninism was accepted as part of CPSU's vocabulary and doctrine around 1922, and in January 1923, despite objections from Lenin, it entered the public vocabulary.§!"
 trotskyist: "Trotskyist"
 trotskyist_desc: "Trotskyist Government\n§LTrotskyism is the political ideology and branch of Marxism and Leninism developed by Russian revolutionary and intellectual Leon Trotsky along with some other members of the Left Opposition and the Fourth International. Trotsky described himself as an orthodox Marxist, a revolutionary Marxist, and a Bolshevik–Leninist as well as a follower of Karl Marx, Friedrich Engels, Vladimir Lenin, Karl Liebknecht, and Rosa Luxemburg. His relations with Lenin have been a source of intense historical debate. However, on balance, scholarly opinion among a range of prominent historians and political scientists such as E. H. Carr, Isaac Deutscher, Moshe Lewin, Ronald Suny, Richard B. Day and W. Bruce Lincoln was that Lenin's desired \"heir\" would have been a collective responsibility in which Trotsky was placed in \"an important role and within which Stalin would be dramatically demoted (if not removed)\". Trotsky advocated for a decentralized form of economic planning (while simultaneously proposing to \"coordinate the entire economy through a central economic plan\"), workers' control of production, the elected representation of multiple Soviet socialist parties, mass soviet democratization, the tactic of a united front against far-right parties, cultural autonomy for artistic movements, voluntary collectivisation, a transitional program, and socialist internationalism. He supported founding a vanguard party of the proletariat, and a dictatorship of the proletariat (as opposed to the \"dictatorship of the bourgeoisie\", which Marxists argue is a major component of capitalism) based on working-class self-emancipation and council democracy. Trotsky also adhered to scientific socialism and viewed this as a conscious expression of historical processes. Trotskyists are critical of Stalinism as they oppose Stalin's theory of socialism in one country in favour of Trotsky's theory of permanent revolution. Trotskyists criticize the bureaucracy and anti-democratic current developed in the Soviet Union under Stalin. Despite their ideological disputes, Trotsky and Lenin were close personally prior to the London Congress of Social Democrats in 1903 and during the First World War. During the Russian Revolution and its aftermath, Lenin and Trotsky remained close personally, and became close ideologically. Trotskyists and some others call Trotsky its \"co-leader\". This was also alluded to by Rosa Luxemburg. Lenin himself never mentioned the concept of \"Trotskyism\" after Trotsky became a member of the Bolshevik party. Trotsky was the Red Army's paramount leader in the Revolutionary period's direct aftermath. Trotsky initially opposed some aspects of Leninism, but eventually concluded that unity between the Mensheviks and Bolsheviks was impossible and joined the Bolsheviks. Trotsky played a leading role with Lenin in the October Revolution. Lenin and Trotsky were also both honorary presidents of the Third International. Trotskyists have traditionally drawn upon Lenin's testament and his alliance with Trotsky in 1922–23 against the Soviet bureaucracy as primary evidence that Lenin sought to remove Stalin from the position of General Secretary. Various historians have also cited Lenin's proposal to appoint Trotsky Vice-Chairman of the Soviet Union as further evidence that he intended Trotsky to be his successor as head of government. In October 1927, by order of Stalin, Trotsky was removed from power. In November of the same year, he was expelled from the All-Union Communist Party (Bolsheviks) (VKP(b)). He was exiled to Alma-Ata (now Almaty) in January 1928 and then expelled from the USSR in February 1929. As the head of the Fourth International, Trotsky continued in exile to oppose what he termed the degenerated workers' state in the USSR. On 20 August 1940, Trotsky was attacked in Mexico City by Ramón Mercader, a Spanish-born NKVD agent, and died the next day in a hospital. His murder is considered a political assassination. Almost all Trotskyists within the VKP(b) had been executed in the Great Purges of 1937–1938, effectively removing all of Trotsky's internal influence in the USSR. Nikita Khrushchev had come to power as head of the Communist Party in Ukraine, signing lists of other Trotskyists to be executed. Trotsky and the party of Trotskyists were still recognized as enemies of the USSR during Khrushchev's rule of the USSR after 1956. Trotsky's Fourth International was established in the French Third Republic in 1938 when Trotskyists argued that the Comintern or Third International had become irretrievably \"lost to Stalinism\" and thus incapable of leading the international working class to political power.§!"
 maoist: "Maoist"
 maoist_desc: "Maoist Government\n§LMaoism, officially Mao Zedong Thought, is a variety of Marxism–Leninism that Mao Zedong developed while trying to realise a socialist revolution in the agricultural, pre-industrial society of the Republic of China and later the People's Republic of China. A difference between Maoism and traditional Marxism–Leninism is that a united front of progressive forces in class society would lead the revolutionary vanguard in pre-industrial societies rather than communist revolutionaries alone. This theory, in which revolutionary praxis is primary and ideological orthodoxy is secondary, purports to represent urban Marxism–Leninism adapted to pre-industrial China. Later theoreticians expanded on the idea that Mao had adapted Marxism–Leninism to Chinese conditions, arguing that he had in fact updated it fundamentally and that Maoism could be applied universally throughout the world. This ideology is often referred to as Marxism–Leninism–Maoism to distinguish it from the original ideas of Mao. From the 1950s until the reform and opening up of Deng Xiaoping in the late 1970s, Maoism was the political and military ideology of the Chinese Communist Party and Maoist revolutionary movements worldwide. After the Sino-Soviet split of the 1960s, the Chinese Communist Party and the Communist Party of the Soviet Union each claimed to be the sole heir and successor to Joseph Stalin concerning the correct interpretation of Marxism–Leninism and the ideological leader of world communism. The English term \"Maoism\" was coined in 1951, by Benjamin I. Schwartz to describe as Mao's pragmatic strategy of revolution which adapted elements of Marxism-Leninism, particularly a disciplined and hierarchical Communist Party, onto a mobilized peasant mass base.§!"
 stalinist: "Stalinist"
 stalinist_desc: "Stalinist Government\n§LStalinism is the totalitarian means of governing and Marxist–Leninist policies implemented in the Soviet Union (USSR) from 1927 to 1953 by dictator Joseph Stalin and in Soviet satellite states between 1944 and 1953. Stalinism included the creation of a one man totalitarian police state, rapid industrialization, the theory of socialism in one country, forced collectivization of agriculture, intensification of class conflict, a cult of personality, and subordination of the interests of foreign communist parties to those of the Communist Party of the Soviet Union, which Stalinism deemed the leading vanguard party of communist revolution at the time. After Stalin's death and the Khrushchev Thaw, a period of de-Stalinization began in the 1950s and 1960s, which caused the influence of Stalin's ideology to begin to wane in the USSR. Stalin's regime forcibly purged society of what it saw as threats to itself and its brand of communism (so-called \"enemies of the people\"), which included political dissidents, non-Soviet nationalists, the bourgeoisie, better-off peasants (\"kulaks\"), and those of the working class who demonstrated \"counter-revolutionary\" sympathies. This resulted in mass repression of such people and their families, including mass arrests, show trials, executions, and imprisonment in forced labor camps known as gulags. The most notorious examples were the Great Purge and the Dekulakization campaign. Stalinism was also marked by militant atheism, mass anti-religious persecution, and ethnic cleansing through forced deportations. Some historians, such as Robert Service, have blamed Stalinist policies, particularly collectivization, for causing famines such as the Holodomor. Other historians and scholars disagree on Stalinism's role. Officially designed to accelerate development towards communism, the need for industrialization in the Soviet Union was emphasized because the Soviet Union had previously fallen behind economically compared to Western countries and that socialist society needed industry to face the challenges posed by internal and external enemies of communism. Rapid industrialization was accompanied by mass collectivization of agriculture and rapid urbanization, which converted many small villages into industrial cities. To accelerate the development of industrialization, Stalin imported materials, ideas, expertise, and workers from western Europe and the United States, pragmatically setting up joint-venture contracts with major American private enterprises such as the Ford Motor Company, which, under state supervision, assisted in developing the basis of the industry of the Soviet economy from the late 1920s to the 1930s. After the American private enterprises had completed their tasks, Soviet state enterprises took over.§!"
 anarchist: "Anarchist Communist"
 anarchist_desc: "Anarchist Communist Government\n§LAnarchist communism is an anarchist school of thought that advocates a form of communism where society is organized through horizontal networks of voluntary associations. It calls for the abolition of hierarchies, as well as private property but retention of personal property and collectively owned items, goods, and services. It supports common ownership of property and the free distribution of resources under the principle of \"from each according to his ability, to each according to his needs\". Anarchist communism was first formulated as such in the Italian section of the International Workingmen's Association. The theoretical work of Peter Kropotkin took importance later as it expanded and developed pro-organizationalist and insurrectionary anti-organizationalist section. Examples of anarchist communist societies are the anarchist territories of the Makhnovshchina during the Russian Revolution, and those of the Spanish Revolution, most notably revolutionary Catalonia.§!" #lol
 eurocommunist: "Eurocommunist"
 eurocommunist_desc: "Eurocommunist Government\n§LEurocommunism was a trend in the 1970s and 1980s within various Western European communist parties, which said they had developed a theory and practice of social transformation more relevant for Western Europe. During the Cold War, they sought to reject the influence of the Soviet Union and its Communist Party. The trend was especially prominent in Italy, Spain, and France. It is commonly considered to have been prompted by the Prague Spring. Although the various parties converged against the Soviet factor, their own doctrines remained as different at the dissolution of the movement as they originally were before 1968.\nHowever with the emergence of the European Union, the idea of unified european communism has regained a bit of support, with the ideology moving away from being an anti-soviet ideology, instead rallying around communist pan-europeanism.§!"
 councilist: "Councilist"
 councilist_desc: "Council Government\n§LCouncil communism or councilism is a current of left-communist thought that emerged in the 1920s. Inspired by the November Revolution, council communism was opposed to state socialism and advocated workers' councils and council democracy. Councilism is also opposed to Leninism and Stalinism. It was strongest in Germany and the Netherlands during the 1920s.§!"

 socialism: "Socialism"
 socialism_noun: "Socialist"
 socialism_desc: "Socialist Government\n§LSocialism is an economic ideology and political philosophy encompassing diverse economic and social systems characterised by social ownership of the means of production, as opposed to private ownership. It describes the economic, political, and social theories and movements associated with the implementation of such systems. Social ownership can take various forms, including public, community, collective, cooperative, or employee. As one of the main ideologies on the political spectrum, socialism is the standard left-wing ideology in most countries. Types of socialism vary based on the role of markets and planning in resource allocation, and the structure of management in organizations. Socialist systems are divided into non-market and market forms. A non-market socialist system seeks to eliminate the perceived inefficiencies, irrationalities, unpredictability, and crises that socialists traditionally associate with capital accumulation and the profit system. Market socialism retains the use of monetary prices, factor markets and sometimes the profit motive. As a political force, socialist parties and ideas exercise varying degrees of power and influence, heading national governments in several countries. Socialist politics have been internationalist and nationalist; organised through political parties and opposed to party politics; at times overlapping with trade unions and other times independent and critical of them, and present in industrialised and developing nations. Social democracy originated within the socialist movement, supporting economic and social interventions to promote social justice. While retaining socialism as a long-term goal, in the post-war period social democracy embraced a mixed economy based on Keynesianism within a predominantly developed capitalist market economy and liberal democratic polity that expands state intervention to include income redistribution, regulation, and a welfare state. The socialist political movement includes political philosophies that originated in the revolutionary movements of the mid-to-late 18th century and out of concern for the social problems that socialists associated with capitalism. By the late 19th century, after the work of Karl Marx and his collaborator Friedrich Engels, socialism had come to signify anti-capitalism and advocacy for a post-capitalist system based on some form of social ownership of the means of production. By the early 1920s, communism and social democracy had become the two dominant political tendencies within the international socialist movement, with socialism itself becoming the most influential secular movement of the 20th century. Many socialists also adopted the causes of other social movements, such as feminism, environmentalism, and progressivism. Although the emergence of the Soviet Union as the world's first nominally socialist state led to the widespread association of socialism with the Soviet economic model, the term has since shifted to be associated with democratic socialism. Academics sometimes recognised the mixed economies of several Western European and Nordic countries as \"democratic socialist\", although the system of these countries, with only limited social ownership (generally in the form of state ownership), is more usually described as social democracy. Following the revolutions of 1989, many of these countries moved away from socialism as a neoliberal consensus replaced the social democratic consensus in the advanced capitalist world. In parallel, many former socialist politicians and political parties embraced "Third Way" politics, remaining committed to equality and welfare while abandoning public ownership and class-based politics.§!"
 socialist: "Socialist"
 socialist_desc: "$socialism_desc$"
 democratic_socialist: "Democratic Socialist"
 democratic_socialist_desc: "Democratic Socialist Government\n§LDemocratic socialism is a set of left-wing political philosophies that supports political democracy and some form of a socially owned economy, with a particular emphasis on economic democracy, workplace democracy, and workers' self-management within a market socialist, decentralised planned, or democratic centrally planned socialist economy. Democratic socialists argue that capitalism is inherently incompatible with the values of freedom, equality, and solidarity and that these ideals can only be achieved through the realisation of a socialist society. Although most democratic socialists seek a gradual transition to socialism, democratic socialism can support revolutionary or reformist politics to establish socialism. Democratic socialism was popularised by socialists who opposed the backsliding towards a one-party state in the Soviet Union and other nations during the 20th century. The history of democratic socialism can be traced back to 19th-century socialist thinkers across Europe and the Chartist movement in the United Kingdom, which somewhat differed in their goals but shared a common demand for democratic decision-making and public ownership of the means of production and viewed these as fundamental characteristics of the society they advocated for. From the late 19th to the early 20th century, democratic socialism was heavily influenced by the gradualist form of socialism promoted by the British Fabian Society and Eduard Bernstein's evolutionary socialism in Germany. Following the rise of \"actually existing\", barracks socialism in the mid-20th century, \"democratic socialism\" became defined as distinguishing between social democracy and Soviet socialism. Democratic socialism is what most socialists understand by the concept of socialism. The term may be used broadly (such as all forms of socialism which reject a one-party Marxist–Leninist state) or more narrowly. As a broad movement, it includes forms of libertarian socialism, market socialism, reformist socialism, revolutionary socialism, ethical socialism, liberal socialism, state socialism, left populism, Trotskyism, and Eurocommunism all of which share a commitment to democracy. Democratic socialism is contrasted with Marxism–Leninism. Democratic socialists oppose the Stalinist political system and the Marxist–Leninist economic planning system, rejecting as their form of governance the administrative-command model formed in the Soviet Union and other Marxist–Leninist states during the 20th century. Democratic socialism is also distinguished from Third Way social democracy because democratic socialists are committed to the systemic transformation of the economy from capitalism to socialism, while social democrats use capitalism to create a strong welfare state, leaving many businesses under private ownership. However, many democratic socialists also advocate for state regulations and welfare programs in order to reduce the perceived harms of capitalism and slowly transform the economic system. While having socialism as a long-term goal, some moderate democratic socialists are more concerned about curbing capitalism's excesses and are supportive of progressive reforms to humanise it in the present day. In contrast, other democratic socialists believe that economic interventionism and similar policy reforms aimed at addressing social inequalities and suppressing capitalism's economic contradictions can simply exacerbate them or cause them to emerge under a different guise. Those democratic socialists believe that the fundamental issues with capitalism can only be resolved by revolutionary means of replacing the capitalist mode of production with the socialist mode of production through a replacement of private ownership with collective ownership of the means of production and extending democracy to the economic sphere in the form of workplace democracy or industrial democracy. The main criticism of democratic socialism from the perspective of liberal democrats is focused on the compatibility of democracy and socialism, while Marxist–Leninist criticisms are focused on the feasibility of achieving a socialist or communist society through democratic means or without suppressing counter-revolutionary forces. Several academics, political commentators, and scholars have noted that some Western countries, such as France, Sweden and the United Kingdom, have been governed by socialist parties or have social democratic mixed economies sometimes referred to as \"democratic socialist\". However, following the end of the Cold War, many of these countries have moved away from socialism as a neoliberal consensus replaced the social democratic consensus in the advanced capitalist world§!"
 radical_socialist: "Radical Socialist"
 radical_socialist_desc: "Radical Socialist Government\n§LRadical socialism is a political philosophy, doctrine, and tradition within socialism that stresses the idea that a social revolution is necessary to bring about structural changes in society. More specifically, it is the view that revolution is a necessary precondition for transitioning from a capitalist to a socialist mode of production. Revolution is not necessarily defined as a violent insurrection; it is defined as a seizure of political power by mass movements of the working class so that the state is directly controlled or abolished by the working class as opposed to the capitalist class and its interests. Revolutionary socialists believe such a state of affairs is a precondition for establishing socialism and orthodox Marxists believe it is inevitable but not predetermined. Revolutionary socialism encompasses multiple political and social movements that may define \"revolution\" differently from one another. These include movements based on orthodox Marxist theory such as De Leonism, impossibilism and Luxemburgism, as well as movements based on Leninism and the theory of vanguardist-led revolution such as Stalinism, Maoism, Marxism–Leninism and Trotskyism. Revolutionary socialism also includes other Marxist, Marxist-inspired and non-Marxist movements such as those found in democratic socialism, revolutionary syndicalism, anarchism, and social democracy (as defined by Karl Kautsky). Revolutionary socialism is contrasted with reformist socialism, especially the reformist approach of modern social democracy and other evolutionary approaches to socialism. Revolutionary socialism is opposed to social movements that seek to gradually ameliorate capitalism's economic and social problems through political reform.§!"
 syndicalist: "Syndicalist"
 syndicalist_desc: "Syndicalist Government\n§LSyndicalism is a revolutionary socialist current within the broader labor movement that seeks to unionize workers according to industry and utilize these unions both as a means to advance their demands through strikes and other forms of direct action, and to usher in a social revolution that would establish social ownership and workers' control over the means of production and the economy at large. Syndicalist unions first emerged in Spain and North America in the 1870s, before rising to prominence in France and later emerging on other continents. Syndicalist movements were most predominant amongst the socialist movement during the interwar period that preceded the outbreak of World War II. Major syndicalist organizations included the General Confederation of Labor (CGT) in France, the Confederacion Nacional del Trabajo (CNT) in Spain, the Italian Syndicalist Union (USI), the Free Workers' Union of Germany (FAUD), the Argentine Regional Workers' Federation (FORA) and the Swedish Central Organisation of Swedish Workers (SAC). Although they did not regard themselves as syndicalists, the Industrial Workers of the World (IWW) (nicknamed "Wobblies") in the United States, the Irish Transport and General Workers' Union (ITGWU), and the Canadian One Big Union (OBU) are considered by some historians to belong to this movement.§!"
 eco_socialist: "Eco-Socialist"
 eco_socialist_desc: "Eco-Socialist Government\n§LEco-socialism (also known as green socialism, socialist ecology, ecological materialism, or revolutionary ecology) is an ideology merging aspects of socialism with that of green politics, ecology and alter-globalization or anti-globalization. Eco-socialists generally believe that the expansion of the capitalist system is the cause of social exclusion, poverty, war and environmental degradation through globalization and imperialism, under the supervision of repressive states and transnational structures. Eco-socialism asserts that the capitalist economic system is fundamentally incompatible with the ecological and social requirements of sustainability. Thus, according to this analysis, giving economic priority to the fulfillment of human needs while staying within ecological limits, as sustainable development demands, is in conflict with the structural workings of capitalism. By this logic, market-based solutions to ecological crises (such as environmental economics and green economy) are rejected as technical tweaks that do not confront capitalism's structural failures. Eco-socialists advocate for the succession of capitalism by eco-socialism—an egalitarian economic/political/social structure designed to harmonize human society with non-human ecology and to fulfill human needs—as the only sufficient solution to the present-day ecological crisis, and hence the only path towards sustainability. Eco-socialists advocate dismantling capitalism, focusing on social ownership of the means of production by freely associated producers, and restoring the commons.§!"
 market_socialist: "Market Socialist"
 market_socialist_desc: "Market Socialist Government\n§LMarket socialism is a type of economic system involving social ownership of the means of production within the framework of a market economy. Various models for such a system exist, usually involving cooperative enterprises and sometimes a mix that includes public or private enterprises. In contrast to the majority of historic self-described socialist economies, which have substituted some form of economic planning for the market mechanism, market socialists wish to retain the use of supply and demand signals to guide the allocation of capital goods and the means of production. Under such a system, depending on whether socially owned firms are state-owned or operated as worker cooperatives, profits may variously be used to directly remunerate employees, accrue to society at large as the source of public finance, or be distributed amongst the population in a social dividend.§!"
 ethical_socialist: "Ethical Socialist"
 ethical_socialist_desc: "Ethical Socialist Government\n§LEthical socialism is a political ideology and philosophy that appeals to socialism on ethical and moral grounds as opposed to consumeristic, economic, and egoistic grounds. It emphasizes the need for a morally conscious economy based upon the principles of altruism, cooperation, and social justice while opposing possessive individualism. In contrast to socialism inspired by historical materialism, Marxist theory, and neoclassical economics which base their appeals for socialism on grounds of economic efficiency, or historical inevitability, ethical socialism focuses on the moral and ethical reasons for advocating socialism. It became the official philosophy of several socialist parties. Former British prime minister Clement Attlee followed a version of Ethical socialism and had shaped the labour party of the later 1930s all the way into the early 50s in Ethical socialism.§!"
 christian_socialist: "Christian Socialist"
 christian_socialist_desc: "Christian Socialist Government\n§LChristian socialism is a religious and political philosophy that blends Christianity and socialism, endorsing socialist economics on the basis of the Bible and the teachings of Jesus. Many Christian socialists believe capitalism to be idolatrous and rooted in the sin of greed. Christian socialists identify the cause of social inequality to be the greed that they associate with capitalism. Christian socialism became a major movement in the United Kingdom beginning in the 19th century. The Christian Socialist Movement, known as Christians on the Left since 2013, is one formal group, as well as a faction of the Labour Party.§!"
 buddhist_socialist: "Buddhist Socialist"
 buddhist_socialist_desc: "Buddhist Socialist\n§LBuddhist socialism refers to a set of philosophies and political ideologies which synthesize the socioeconomic views and egalitarian values of socialism with the teachings and principles of Buddhism. A common feature of Buddhist socialism is that it sees the Buddhist goal of the inner transformation of the mind and the socialist goal of the transformation of socioeconomic relations as being deeply interdependent. Both Buddhism and socialism seek to provide an end to suffering by analyzing its conditions (craving and the capitalist mode of production respectively) and removing its main causes through praxis (respectively, spiritual and political). Both also seek to provide a transformation of personal consciousness to bring an end to human alienation and selfishness. Buddhism approaches this mainly from the perspective of internal self-cultivation practices, while socialism tends to focus on external conditions and relations. The various forms of Buddhist socialism generally seek to synthesize both traditions of liberation, which are seen as complementary. As there are numerous strains of socialism and Buddhism, so are there numerous forms of Buddhist socialism, with different perspectives on political praxis, metaphysics and views on how spiritual liberation is connected with sociopolitical liberation. Buddhist socialism emerged in the 19th and 20th centuries in various Asian nations as a response to colonialism, imperialism and the rise of global capitalism by Asian buddhists and socialists. People who have been described as Buddhist socialists include Buddhadasa Bhikkhu, B. R. Ambedkar, Han Yong-un, Girō Senoo, Uchiyama Gudō, Inoue Shūten, Norodom Sihanouk, Takagi Kenmyo and Peljidiin Genden.§!"
 islamic_socialist: "Islamic Socialist"
 islamic_socialist_desc: "Islamic Socialist Government\n§LIslamic socialism is a political philosophy that incorporates elements of Islam into a system of socialism. As a term, it was coined by various left-wing Muslim leaders to describe a more spiritual form of socialism. Islamic socialists believe that the teachings of the Qur'an and hadith, citing aspects of the religion like zakat, are not only compatible with principles of socialism, but also very supportive of them. Some early figures in Islam, such as Abu Dharr al-Ghifari, a companion of Muhammad, and the first Caliph, Abu Bakr, are sometimes regarded as forerunners of Islamic socialism for their advocacy of wealth redistribution. Interest in fusing Islam and socialism emerged in the nineteenth century, with Islamic Reformist thinker Jamal al-Din al-Afghani, whose writings on the topic were published in the 1930s and influenced many later thinkers. Social movements such as the Wäisi movement in Tatarstan, in the Russian empire, similarly drew on Islamic and socialist thought. In the twentieth century, the Indian Deobandi scholar Ubaidullah Sindhi, the Movement of God-Worshipping Socialists in Iran, the Muslim League in Pakistan, and the Iranian scholar Ali Shariati are among those to play a role in the history of the ideology.§!"

 social_democracy: "Social Democracy"
 social_democracy_noun: "Social Democrat"
 social_democracy_desc: "Social Democratic Government\n§LSocial democracy is a broad, centre-left social, economic, and political ideology. Some academics view social democracy as distinct from socialism, whilst other academics purport that social democracy lies within the wider socialist movement. Social democracy supports political and economic democracy and a gradualist, reformist, and democratic approach toward achieving social equality. In modern practice, social democracy has taken the form of a predominantly capitalist, yet robust welfare state, with policies promoting social justice, market regulation, and a more equitable distribution of income. Social democracy maintains a commitment to representative and participatory democracy. Common aims include curbing inequality, eliminating the oppression of underprivileged groups, eradicating poverty, and upholding universally accessible public services such as child care, education, elderly care, health care, and workers' compensation. Economically, it supports income redistribution and regulating the economy in the public interest. Social democracy has a long-standing connection with trade unions and the broader labour movement. It is supportive of measures to foster greater democratic decision-making in the economic sphere, including collective bargaining and co-determination rights for workers. The history of social democracy stretches back to the 19th-century labour movement. Originally a catch-all term for socialists of varying tendencies, after the Russian Revolution, it came to refer to reformist socialists who were strategically opposed to revolution as well as to the authoritarianism of the Soviet model, though the eventual abolition of capitalism was still upheld as an important end goal. However, by the 1990s social democrats had embraced mixed economies with a predominance of private property and promoted the regulation of capitalism over its replacement with a qualitatively different socialist economic system. Since then, social democracy has been associated with Keynesian economics, the Nordic model, and welfare states. The Third Way was developed in the 1990s as an offshoot of social democracy which aims to fuse economic liberalism with social democratic economic policies and center-left social policies. This reconceptualization is embraced by some social democratic parties, though some political scientists and analysts characterise it as an effectively neoliberal movement. Social democracy has been described as the most common form of Western or modern socialism, as well as the reformist wing of democratic socialism. Amongst social democrats, attitudes towards socialism vary: some retain socialism as a long-term goal, with social democracy being a political and economic democracy supporting a gradualist, reformist, and democratic approach towards achieving socialism. Others view it as an ethical ideal to guide reforms within capitalism. While both social democracy and democratic socialism once referred to movements seeking to achieve socialism, modern social democracies retain a capitalist system, whereas democratic socialists continue to advocate for its abolition. Nevertheless, the distinction remains blurred in colloquial settings, and the two terms are commonly used synonymously.§!"
 social_democrat: "Social Democrat"
 social_democrat_desc: "$social_democracy_desc$"
 progressive: "Progressive"
 progressive_desc: "Progressive government\n§LProgressivism is a left-leaning political philosophy and reform movement. Into the 21st century, it advocates policies that are generally considered social democratic and part of the American Left. It has also expressed itself within center-right politics, such as New Nationalism and progressive conservatism. It reached its height early in the 20th century. Middle, working class and reformist in nature, it arose as a response to the vast changes brought by modernization, such as the growth of large corporations, pollution, and corruption in American politics. Progressive economic policies incorporate the socioeconomic principles of social democracy and the concept of social justice, having the goal of improving the human condition through government regulation, social protections, and the maintenance of public goods. Economic progressivism is based on the idea that capitalist markets left to operate with limited government regulation are inherently unfair, favoring big business, large corporations, and the wealthy. Specific economic policies that are considered progressive include progressive taxes, income redistribution aimed at reducing inequalities of wealth, a comprehensive package of public services, universal health care, resisting involuntary unemployment, public education, social security, minimum wage laws, antitrust laws, legislation protecting labor rights, and the rights of labor unions. While the contemporary progressive movement may be characterized as largely secular in nature, the progressivism of the Progressive Era was by comparison to a significant extent rooted in and energized by religion.§!"
 guild_socialist: "Guild Socialist"
 guild_socialist_desc: "Guild Socialist Government\n§LGuild socialism is an ideology and a political movement advocating workers' control of industry through the medium of trade-related guilds \"in an implied contractual relationship with the public\". It originated in the United Kingdom and was at its most influential in the first quarter of the 20th century. It was strongly associated with G. D. H. Cole and influenced by the ideas of William Morris.§!"
 labour_unionist: "Labour Unionist"
 labour_unionist_desc: "Labour Unionist Government\n§L§!"
 reformist_socialist: "Reformist Socialist"
 reformist_socialist_desc: "Reformist Socialist Government\n§LThe first modern socialists of the 19th century followed utopian socialism. Rather than advocating for revolution, thinkers such as Henri de Saint-Simon, Charles Fourier, and Robert Owen believed they could convince the governments and ruling classes in England and France to adopt their schemes through persuasion. Reformism has expressed itself in socialism through a willingness to challenge revolutionary tenets of Marxist orthodoxy and through objections to aspects of scientific socialism, being broadly labeled as reformist socialism or progressive socialism. 19th-century economist G. A. Kleene referred to progressive socialism as containing Eduard Bernstein's position against \"'Old-School' Marxism\". Reformist willingness to challenge scientific socialism, such as through critique of the law of increasing misery, has been historically connected to the concept of progressive socialism. In 1875, the Social Democratic Party of Germany (SPD) adopted a Lassallist orientation in its Gotha Program, which proposed \"every lawful means\" on a way to a \"socialist society\" and was criticized by Karl Marx, who considered communist revolution a required step. One of the delegates to the SPD congress was Bernstein, who later expanded on the concept, proposing what he termed \"evolutionary socialism\". Bernstein’s \"revisionism\" was quickly targeted by revolutionary socialists. Rosa Luxemburg condemned Bernstein's evolutionary socialism in her 1900 essay Social Reform or Revolution? and the orthodox Marxist Karl Kautsky sharply criticized Bernstein’s framework in his 1909 work Road to Power. After Luxemburg died in the German Revolution, reformists in the SPD soon found themselves contending with the Bolsheviks and their satellite Communist parties for the support of intellectuals and the working class. In 1959, the Godesberg Program (signed at a party convention in Bad Godesberg in the West German capital of Bonn) marked the shift of the SPD from an orthodox Marxist program espousing an end to the capitalist system to a reformist one focused on social reform. After Joseph Stalin consolidated power in the Soviet Union, the Comintern launched a campaign against the reformist movement by denouncing them as "social fascists." According to The God that Failed by Arthur Koestler, a former member of the Communist Party of Germany, the largest communist party in Western Europe in the interwar period, communists aligned with the Soviet Union continued to consider the SPD to be the real enemy in Germany even after the Nazi Party had gotten into power. In Italy during the onslaught of Italian fascism, Carlo Rosselli broadly concurred with Bernstein's revisionist and reformist assessment of orthodox Marxism, endorsing the perspective that socialism ought to be the democratic successor of liberalism and emphasizing anti-fascism. Both Rosselli and Bernstein dismissed the rigorous historical materialism and deterministic perspective of class struggle intrinsic to traditional Marxism, instead endorsing a pragmatic, ethical, and political approach to social democracy within the framework of existing liberal-democratic institutions (which Rosselli worked into his framework of liberal socialism). Reformism is not directly synonymous with gradualism. However, Fabianism in the United Kingdom, while not a direct parallel of the Marxist reformism associated with Bernstein and the German SPD, is noted as having \"undoubtedly done much toward the permeation of public opinion with a progressive evolutionary socialism\" and being a gradualist tendency within progressive socialism or reformist socialism. Reformism was applied to elements within the British Labour Party in the 1950s and subsequently on the party's right wing. Anthony Crosland wrote The Future of Socialism (1956) as a personal manifesto arguing for a reformulation of the term. For Crosland, the relevance of nationalization, or public ownership, for socialists was much reduced as a consequence of contemporary full employment, Keynesian management of the economy and reduced capitalist exploitation. After the third successive defeat of his party in the 1959 United Kingdom general election, Hugh Gaitskell attempted to reformulate the original wording of Clause IV in the party's constitution, but proved unsuccessful. Some of the younger followers of Gaitskell, principally Roy Jenkins, Bill Rodgers and Shirley Williams, left the Labour Party in 1981 to found the Social Democratic Party; however, the central objective of the Gaitskellites was eventually achieved by Tony Blair in his successful attempt to rewrite Clause IV in 1995. In the 21st century, progressive or reformist socialism may be associated with the left wing of social democracy, or the moderate or \"mainstream\" wing of democratic socialism, and liberal socialism.§!"

 liberalism: "Liberalism"
 liberalism_noun: "Liberal"
 liberalism_desc: "Liberal Government\n§LLiberalism is a political and moral philosophy based on the rights of the individual, liberty, consent of the governed, political equality, right to private property, and equality before the law. Different liberals espouse various and sometimes conflicting views depending on their understanding of these principles but generally support liberal democracy, private property, market economies, individual rights (including civil rights and human rights), secularism, rule of law, economic and political freedom, freedom of speech, freedom of the press, freedom of assembly, and freedom of religion. Liberalism is frequently cited as the dominant ideology of modern history. Liberalism became a distinct movement in the Age of Enlightenment, gaining popularity among Western philosophers and economists. Liberalism sought to replace the norms of hereditary privilege, state religion, absolute monarchy, the divine right of kings, and traditional conservatism with representative democracy, rule of law, and equality under the law. Liberals also ended mercantilist policies, royal monopolies, and other trade barriers, instead promoting free trade and marketization. The philosopher John Locke is often credited with founding liberalism as a distinct tradition based on the social contract, arguing that each man has a natural right to life, liberty and property, and governments must not violate these rights. While the British liberal tradition emphasized expanding democracy, French liberalism emphasized rejecting authoritarianism. Leaders in the British Glorious Revolution of 1688, the American Revolution of 1776, and the French Revolution of 1789 used liberal philosophy to justify the armed overthrow of royal sovereignty. The 19th century saw liberal governments established in Europe and South America, and it was well-established alongside republicanism in the United States. In Victorian Britain, it was used to critique the political establishment, appealing to science and reason on behalf of the people. During the 19th and early 20th centuries, liberalism in the Ottoman Empire and the Middle East influenced periods of reform, such as the Tanzimat and Al-Nahda, and the rise of constitutionalism, nationalism, and secularism. These changes, along with other factors, helped to create a sense of crisis within Islam, which continues to this day, leading to Islamic revivalism. Before 1920, the main ideological opponents of liberalism were communism, conservatism, and socialism; liberalism then faced major ideological challenges from fascism and Marxism–Leninism. During the 20th century, liberal ideas spread further, especially in Western Europe, as liberal democracies won both world wars and the Cold War. Liberals sought and established a constitutional order that prized important individual freedoms, such as freedom of speech and freedom of association; an independent judiciary and public trial by jury; and the abolition of aristocratic privileges. Later waves of modern liberal thought and struggle were strongly influenced by the need to expand civil rights. Liberals have advocated gender and racial equality in their drive to promote civil rights, and global civil rights movements in the 20th century achieved several objectives towards both goals. Other goals often accepted by liberals include universal suffrage and universal access to education. In Europe and North America, the establishment of social liberalism (often called simply liberalism in the United States) became a key component in expanding the welfare state. 21st-century liberal parties continue to wield power and influence throughout the world. The fundamental elements of contemporary society have liberal roots. The early waves of liberalism popularised economic individualism while expanding constitutional government and parliamentary authority.§!"
 liberal: "Liberal"
 liberal_desc: "$liberalism_desc$"
 social_liberal: "Social Liberal"
 social_liberal_desc: "Social Liberal Government\n§LSocial liberalism or progressive liberalism is a political philosophy and variety of liberalism that endorses social justice, social services, a mixed economy, and the expansion of civil and political rights, as slightly opposed to classical liberalism which favors limited government and an overall more laissez-faire style of governance. While both are committed to personal freedoms, social liberalism places greater emphasis on the role of government in addressing social inequalities and ensuring public welfare. Social liberal governments address economic and social issues such as poverty, welfare, infrastructure, healthcare, and education using government intervention, while emphasising individual rights and autonomy. Economically, social liberalism is based on the social market economy and views the common good as harmonious with the individual's freedom. Social liberals overlap with social democrats in accepting market intervention more than other liberals; its importance is considered auxiliary compared to social democrats. Ideologies that emphasize its economic policy include welfare liberalism, New Deal liberalism and New Democrats in the United States, and Keynesian liberalism. Almost all of the Western world has widely adopted social liberal policies. Social liberal ideas and parties tend to be considered centre to centre-left, although there are deviations from these positions to both the political left or right. In modern political discourse, social liberalism is associated with progressivism, a left-liberalism contrasted to the right-leaning neoliberalism, and combines support for a mixed economy with cultural liberalism. Cultural liberalism is an ideology that advocates the freedom of individuals to choose whether to conform to cultural norms. In American usage, the term Social liberalism may also refer to American progressive stances on sociocultural issues, such as reproductive rights and same-sex marriage, in contrast with American social conservatism. Cultural liberalism is often referred to as social liberalism because it expresses the social dimension of liberalism; however, it is not the same as the broader political ideology known as social liberalism. In American politics, a social liberal may hold either conservative (economic liberal) or progressive views on fiscal policy.§!"
 market_liberal: "Market Liberal"
 market_liberal_desc: "Market Liberal Government\n§LMarket liberalism is used in two distinct ways. In the United States, the term is used as a synonym to classical liberalism. In this sense, market liberalism depicts a political ideology, combining a market economy with personal liberty and human rights in contrast to social liberalism, which combines personal liberty and human rights along with a mixed economy and welfare state. In Europe and elsewhere, the term market liberalism is often used as a synonym to economic liberalism, depicting a policy supporting the economic aspects of liberalism, without necessarily including the political aspects of liberalism. In some political spheres, market liberalism refers to an economically liberal society that also provides a minimal to moderate-sized welfare state for its citizens.§!"
 corporatist_liberal: "Corporatist Liberal"
 corporatist_liberal_desc: "Corporatist Liberal Government\n§LLiberal corporatism is an economic-democratic and liberal-socialist application of corporatism, which seeks workers' election of management and minimal state intervention in sector bargaining over economic policy. However, some forms of liberal corporatism exhibit non-socialist and nationalist-liberal characteristics. 'Liberal corporatism' is often in conflict with 'liberal pluralism', which opposes granting power to organised interest groups. English liberal socialist philosopher John Stuart Mill supported corporatism as needing to predominate in society to create equality for labourers and give them a voice in management through democratic economic rights. Unlike a number of other forms of corporatism, liberal corporatism does not reject markets or individualism, but rather believes that a business is a social institution that requires a recognition of the needs of its members. This liberal corporatist ethic was similar to Taylorism but called for democratisation of the firm and election of management. Liberal corporatism was an influential component of the progressivism in the United States that has been referred to as \"interest group liberalism\". Labour leaders' and progressives' advocacy of liberal corporatism is believed to have been influenced in reaction to the rise of syndicalism and particularly anarcho-syndicalism at the time in Europe. Liberal corporatism is commonly supported by proponents in Austria, the Netherlands, Denmark, Finland, Norway, and Sweden.§!"
 technocrat: "Technocrat"
 technocrat_desc: "Technocrat Government\n§LTechnoliberalism is a political ideology founded on ideas of liberty, individuality, responsibility, decentralization, and self-awareness. It also highlights an idea that technology should be available to everyone with minimal controls. Its core beliefs fit under five main interests that include Construction of the Government, Economics, Civil Liberties, Education and Science, and Environment. Technoliberals support such ideas as the balance of powers in the government, decentralization, affordable education, the protection of planet Earth, and the freedom of speech.§!"
 neo_liberal: "Neo-Liberal"
 neo_liberal_desc: "Neo-Liberal Government\n§LNeoliberalism is a political and economic ideology that advocates for free-market capitalism, and that became dominant in policy-making from the late 20th century onward. The term has multiple, competing definitions, and is most often used pejoratively. In scholarly use, the term is often left undefined or used to describe a multitude of phenomena. However, it is primarily employed to delineate the societal transformation resulting from market-based reforms. Neoliberalism is often associated with a set of economic liberalization policies, including lower taxes, privatization, deregulation, depoliticization, consumer choice, labor market flexibilization, economic globalization, free trade, monetarism, austerity, and reductions in government spending. These policies are designed to increase the role of the private sector in the economy and society. Additionally, the neoliberal project is oriented towards the establishment of institutions and is inherently political in nature, extending beyond mere economic considerations. Neoliberalism has become an increasingly prevalent term in recent decades. It has been a significant factor in the proliferation of conservative and right-libertarian organizations, political parties, and think tanks, and predominantly advocated by them. The term is largely absent from economics journals. Recent critiques argue that neoliberalism has exacerbated income and wealth inequality by promoting policies that prioritize market efficiency over social welfare. Labor deregulation under neoliberal agendas has led to the rise of nonstandard work arrangements, such as zero-hour contracts, which often lack job security, consistent income, and access to benefits. These conditions disproportionately impact low-wage workers and contribute to broader socioeconomic divides. Additionally, neoliberal reforms have encouraged privatization in education and healthcare, intensifying debates about access and affordability. Critics assert that while neoliberalism may aim for economic growth, its implementation often overlooks the structural disadvantages faced by marginalized populations, raising questions about long-term equity and sustainability. These critiques have fueled contemporary policy discussions about balancing market freedom with inclusive economic reforms. The term is rarely used by proponents of free-market policies. When the term entered into common academic use during the 1980s in association with Augusto Pinochet's economic reforms in Chile, it quickly acquired negative connotations and was employed principally by critics of market reform and laissez-faire capitalism. Scholars tended to associate it with the theories of economists working with the Mont Pelerin Society, including Friedrich Hayek, Milton Friedman, Ludwig von Mises, and James M. Buchanan, along with politicians and policy-makers such as Margaret Thatcher, Ronald Reagan, and Alan Greenspan. Once the new meaning of neoliberalism became established as common usage among Spanish-speaking scholars, it diffused into the English-language study of political economy. By 1994, the term entered global circulation and scholarship surrounding the topic has grown over the last few decades. Neoliberalism originated among European liberal scholars during the 1930s. It emerged as a response to the perceived decline in popularity of classical liberalism, which was seen as giving way to a social liberal desire to control markets. This shift in thinking was shaped by the Great Depression and manifested in policies designed to counter the volatility of free markets. One motivation for the development of policies designed to mitigate the volatility of capitalist free markets was a desire to avoid repeating the economic failures of the early 1930s, which have been attributed, in part, to the economic policy of classical liberalism. In the context of policymaking, neoliberalism is often used to describe a paradigm shift that was said to follow the failure of the post-war consensus and neo-Keynesian economics to address the stagflation of the 1970s, although the 1973 oil crisis, a causal factor, was purely external, and created policy challenges that existing economic frameworks struggled to address. According to multiple scholars the dissolution of the Soviet Union and the end of the Cold War have facilitated the rise of neoliberalism in the United States, the United Kingdom and around the world.§!"
 thatcherist: "Thatcherist"
 thatcherist_desc: "Thatcherist Government\n§LThatcherism is the neo-liberalism used by Margaret Thatcher during her reign as prime minister of the United Kingdom.§!"
 reaganist: "Reaganist"
 reaganist_desc: "Reaganist Government\n§LReaganism is the neo-liberalism used by Ronald Reagan during his reign as president of the United States of America.§!"
 eco_liberal: "Eco-Liberal"
 eco_liberal_desc: "Eco-Liberal Government\n§LEco-Liberalism or Green Liberalism is liberalism that includes green politics in its ideology. Green liberals are usually liberal on social issues and \"green\" on economic issues. The term \"green liberalism\" was coined by political philosopher Marcel Wissenburg in his 1998 book Green Liberalism: The Free and The Green Society. He argues that liberalism must reject the idea of absolute property rights and accept restraints that limit the freedom to abuse nature and natural resources. However, he rejects the control of population growth and any control over the distribution of resources as incompatible with individual liberty, instead favoring supply-side control: more efficient production and curbs on overproduction and overexploitation. This view tends to dominate the movement, although critics say it actually puts individual liberties above sustainability.§!"

 agrarianism: "Agrarianism"
 agrarianism_noun: "Agrarianist"
 agrarianism_desc: "Agrarianist Government\n§LAgrarianism is a social and political philosophy that advocates for rural development, a rural agricultural lifestyle, family farming, widespread property ownership, and political decentralization. Those who adhere to agrarianism tend to value traditional forms of local community over urban modernity. Agrarian political parties sometimes aim to support the rights and sustainability of small farmers and poor peasants against the wealthy, powerful and famous in society.§!"
 agrarianist: "Agrarianist"
 agrarianist_desc: "$agrarianism_desc$"
 centrist: "Centrist"
 centrist_desc: "Centrist Government\n§LCentrism is the range of political ideologies that exist between left-wing politics and right-wing politics on the left–right political spectrum. It is associated with moderate politics on the left-right spectrum, including people who strongly support moderate policies and people who are not strongly aligned with left-wing or right-wing policies. Centrism is commonly associated with liberalism, radical centrism, and agrarianism. Those who identify as centrist support gradual political change, often through the continuation of welfare state policies with moderate emphasis on redistributive policies. Though its placement is widely accepted in political science, radical groups that oppose centrist ideologies may sometimes describe them as leftist or rightist. Centrist parties typically hold the middle position between major left-wing and right-wing parties, though in some cases they will hold the left-leaning or right-leaning vote if there are no viable parties in the given direction. Centrist parties in multi-party systems hold a strong position in forming coalition governments as they can accommodate both left-wing and right-wing parties, but they are often junior partners in these coalitions and are unable to enact their own policies. These parties are weaker in first-past-the-post voting than proportional representation systems. Parties and politicians have various incentives to move toward or away from the centre, depending on how they seek votes. Some populist parties take centrist positions, basing their political position on opposition to the government as opposed to left-wing or right-wing populism. Centrism developed with the left–right political spectrum during the French Revolution, when assemblymen associated with neither the radicals nor the reactionaries sat between the two groups. Liberalism became the dominant centrist ideology in the 18th century, challenging both conservatism and socialism. Agrarianism briefly existed as a major European centrist movement in the late-19th and early-20th centuries. Centrism became more influential after the dissolution of the Soviet Union as it spread through Europe and the Americas, but it declined following the 2008 financial crisis, with an increase in populism and political polarization.§!"
 third_way: "Third Wayist"
 third_way_desc: "Third Wayist Government\n§LThe Third Way is a predominantly centrist political position that attempts to reconcile centre-right and centre-left politics by synthesising a combination of economically liberal and social democratic economic policies. It is a reconceptualisation of social democracy. It supports workfare instead of welfare, work training programs, educational opportunities, and other government programs that give citizens a 'hand-up' instead of a 'hand-out'. The Third Way seeks a compromise between a less interventionist economic system as supported by neoliberals and European Keynesian social democratic spending policy supported by social democrats and progressives. The Third Way was born from a reevaluation of political policies within various centre to centre-left progressive movements in the 1980s in response to doubt regarding the economic viability of the state and the perceived overuse of economic interventionist policies that had previously been popularised by Keynesianism, but which at that time contrasted with the rise of popularity for neoliberalism and the New Right starting in the late 1970s and throughout the 1980s. The Third Way has been promoted by social liberal and social-democratic parties. In the United States, a leading proponent of the Third Way was President Bill Clinton. In the United Kingdom, Third Way social-democratic proponent Tony Blair claimed that the socialism he advocated was different from traditional conceptions of socialism and said: \"My kind of socialism is a set of values based around notions of social justice. ... Socialism as a rigid form of economic determinism has ended, and rightly.\" Blair referred to it as a \"social-ism\" involving politics that recognised individuals as socially interdependent and advocated social justice, social cohesion, equal worth of each citizen and equal opportunity. Third Way social-democratic interpreter Anthony Giddens has said that the Third Way rejects the state socialist conception of socialism and instead accepts the conception of socialism as conceived of by Anthony Crosland as an ethical doctrine that views social democratic governments as having achieved a viable ethical socialism by removing the unjust elements of capitalism by providing social welfare and other policies and that contemporary socialism has outgrown the Marxist claim for the need of the abolition of capitalism as a mode of production. In 2009, Blair publicly declared support for a \"new capitalism\". Policies supported by self-described Third Way supporters vary by region, political circumstances, and ideological leanings. Third Way advocates generally support public-private partnerships, a commitment to fiscal conservatism, combining equality of opportunity with personal responsibility, improving human and social capital, and protection of the environment. But even in pursuit of these ends, Third Way advocates differ in their policies, owing to conflicting priorities. Anthony Giddens, for example – believing that society should be more inclusive to the elderly – called for abolishing the retirement age so people could exit the workforce whenever they have saved enough; French president Emmanuel Macron did the exact opposite, raising the retirement age to balance the budget. The Bill Clinton administration, being highly influenced by the works of the controversial political scientist Charles Murray, was less friendly to the welfare state than most Democratic party members. The Third Way has been criticised by mainstream democrats, as well as anarchists, communists, and in particular democratic socialists as a betrayal of left-wing values, with some political scientists and analysts characterising the Third Way as an effectively neoliberal movement. It has also been criticised by conservatives, nationalists, classical liberals, and libertarians who advocate for laissez-faire capitalism.§!"
 georgist: "Georgist"
 georgist_desc: "Georgist Government\n§LGeorgism, in modern times also called Geoism, and known historically as the single tax movement, is an economic ideology holding that persons (including corporations) should own the value that they produce themselves, while the economic rent derived from land—including from all natural resources, the commons, and urban locations—should belong equally to all members of society. Developed from the writings of American economist and social reformer Henry George, the Georgist paradigm seeks solutions to social and ecological problems based on principles of land rights and public finance that attempt to integrate economic efficiency with social justice. Georgism is concerned with the distribution of economic rent caused by land ownership, natural monopolies, pollution rights, and control of the commons, including title of ownership for natural resources and other contrived privileges (e.g., intellectual property). Any natural resource that is inherently limited in supply can generate economic rent, but the classical and most significant example of land monopoly involves the extraction of common ground rent from valuable urban locations. Georgists argue that taxing economic rent is efficient, fair, and equitable. The main Georgist policy recommendation is a land value tax (LVT), the revenues from which can be used to reduce or eliminate existing taxes (such as on income, trade, or purchases) that are posited to be unfair and inefficient. Some Georgists also advocate the return of surplus public revenue to the people by means of a basic income or citizen's dividend. George popularized the concept of gaining public revenues mainly from land and natural resource privileges with his first book, Progress and Poverty (1879). The philosophical basis of Georgism draws on thinkers such as John Locke, Baruch Spinoza, and Thomas Paine. Economists from Adam Smith and David Ricardo to Milton Friedman and Joseph Stiglitz have observed that a public levy on land value does not cause economic inefficiency, unlike other taxes. A land value tax also has progressive effects. Advocates of land value taxes argue that they reduce economic inequality, increase economic efficiency, remove incentives to under-utilize urban land, and reduce property speculation. Georgist ideas were popular and influential in the late 19th and early 20th centuries. Political parties, institutions, and communities were founded on Georgist principles. Early devotees of George's economic philosophy were often termed Single Taxers for their political goal of raising public revenue mainly or only from a land-value tax, although Georgists endorsed multiple forms of rent capture (e.g. seigniorage) as legitimate. One contemporary and friend of Henry George who advocated strongly for the Single Tax movement, and lectured at related organizations such as the Manhattan Single Tax Club, was Charles Frederic Adams. The term Georgism was invented later, and some prefer the term geoism as more generic§!"
 eco_agrarianist: "Eco-Agrarianist"
 eco_agrarianist_desc: "Eco-Agrarianist Government\n§LEcocentrism or Eco-agrarianism is a term used by environmental philosophers and ecologists to denote a nature-centered, as opposed to human-centered (i.e., anthropocentric), system of values. The justification for ecocentrism usually consists in an ontological belief and subsequent ethical claim. The ontological belief denies that there are any existential divisions between human and non-human nature sufficient to claim that humans are either (a) the sole bearers of intrinsic value or (b) possess greater intrinsic value than non-human nature. Thus the subsequent ethical claim is for an equality of intrinsic value across human and non-human nature, or biospherical egalitarianism.§!"

 libertarianism: "Libertarianism"
 libertarianism_noun: "Libertarian"
 libertarianism_desc: "Libertarian Government\n§LLLibertarianism (from French: libertaire, lit. 'libertarian'; or from Latin: libertas, lit. 'freedom') is a political philosophy that holds liberty and personal sovereignty as primary values. Many libertarians believe that the concept of freedom is in accord with the non-aggression principle, according to which each individual has the right to live as they choose, as long as they do not violate the rights of others by initiating force or fraud against them. Libertarianism has been broadly shaped by liberal ideas. Libertarians advocate the expansion of individual autonomy and political self-determination, emphasizing the principles of equality before the law and the protection of civil rights, including the rights to freedom of association, freedom of speech, freedom of thought and freedom of choice. They generally support individual liberty and oppose authority, state power, warfare, militarism and nationalism, but some libertarians diverge on the scope and nature of their opposition to existing economic and political systems. Schools of libertarian thought offer a range of views regarding the legitimate functions of state and non-state power. Different categorizations have been used to distinguish these various forms of libertarianism. Scholars have identified distinct libertarian perspectives on the nature of property and capital, typically delineating them along left–right or socialist–capitalist axes§!"
 libertarian: "Libertarian"
 libertarian_desc: "$libertarianism_desc$"
 christian_libertarian: "Christian Libertarian"
 christian_libertarian_desc: "Christian Libertarian Government\n§LChristian libertarianism is the synthesis of Christian beliefs with libertarian political philosophy, with a focus on beliefs about free will, human nature, and God-given inalienable rights. As with some other forms of libertarianism, Christian libertarianism holds that what is prohibited by law should be limited to various forms of assault, theft and fraud. Other actions that are forbidden by Christianity can only be disciplined by the church, or in the case of children and teens, one's parents or guardians. Likewise, beliefs such as \"love your neighbor as yourself\" are not imposed on others so long as the non-aggression principle, which Christian libertarians believe to be foundational, has not been violated.§!"
 consequential_libertarian: "Consequential Libertarian"
 consequential_libertarian_desc: "Consequential Libertarian Government\n§LConsequentialist libertarianism, also known as consequentialist liberalism or libertarian consequentialism, is a libertarian political philosophy and position that is supportive of a free market and strong private property rights only on the grounds that they bring about favorable consequences such as prosperity or efficiency. What consequentialist libertarians advocate is derived through cost–benefit calculation, taking a broad account of consequences. It is contrasted with deontological libertarianism which considers the initiation of force and fraud to be immoral, regardless of consequences. Unlike deontological libertarians, consequentialist libertarians do not necessarily see all cases of initiation of force as immoral and do not see it as inherently immoral (i.e., they do not express a belief in natural rights). Rather, their position is that political and economic liberty lead to the best consequences in the form of happiness and prosperity and for that reason alone it should be supported. Some libertarians may have a conception of libertarianism that is a hybrid of consequentialism and deontology. Unlike deontological libertarians, consequentialist libertarians advocate actions they believe bring about favorable consequences regardless of whether these constitute initiation of force. For example, unlike deontological libertarians, some consequentialist libertarians support eminent domain and involuntary taxes. Particular views vary among consequentialist libertarians, with political theorist David D. Friedman supporting a consequentialist form of anarcho-capitalism where the content of law is bought and sold rather than there being an established legal code forbidding initiation of force§!"
 natural_rights_libertarian: "Natural-rights Libertarian"
 natural_rights_libertarian_desc: "Natural-rights Libertarian Government\n§LNatural-rights libertarianism is the theory that all individuals possess certain natural or moral rights, mainly a right of individual sovereignty and that therefore acts of initiation of force and fraud are rights-violations and that is sufficient reason to oppose those acts. This is one of the two ethical view points within right-libertarianism, the other being consequentialist libertarianism which only takes into account the consequences of actions and rules when judging them and holds that free markets and strong private property rights have good consequences. Some deontological libertarian views are based on the non-aggression principle which states that no human being holds the right to initiate force or fraud against the person or property of another human being under any circumstances. This principle is taken as basic, defining all other moral principles, not simply principles of justice. Others are based on self-ownership, and concerned only with principles of justice.§!"
 technolibertarian: "Technolibertarian"
 technolibertarian_desc: "Technolibertarian Government\n§LTechnolibertarianism, sometimes referred to as cyberlibertarianism, was a political ideology with roots in the Internet's early hacker cypherpunk culture in Silicon Valley in the early 1990s and in American libertarianism. The ideology focused on minimizing government regulation, censorship, or anything else in the way of a \"free\" World Wide Web. In this case, the word \"free\" is referring to the meaning of libre (no restrictions), not gratis (no cost). Cyber-libertarians embrace fluid, meritocratic hierarchies, which are believed to be best served by markets. The most widely known cyberlibertarian is Julian Assange. The term technolibertarian was popularized in critical discourse by technology writer Paulina Borsook in her 2000 book, Cyberselfish: A Critical Romp Through the Terribly Libertarian Culture of High Tech. Others, like academic David Golumbia of Virginia Commonwealth University, explored the same topic in the context of cryptocurrency and right-wing politics. Journalist Gil Duran argues that technolibertarianism was replaced by tech fascism with the rise of Peter Thiel, who distanced himself from libertarianism in 2009.§!"
 enviromentalist: "Enviromentalist"
 enviromentalist_desc: "Enviromentalist Go[ ]vernment\n§LEnvironmentalism is a broad philosophy, ideology, and social movement about supporting life, habitats, and surroundings. While environmentalism focuses on the environmental and nature-related aspects of green ideology and politics, ecologism combines the ideology of social ecology and environmentalism. Ecologism is a term more commonly used in continental European languages, while environmentalism is more commonly used in English, but the words have slightly different connotations. Environmentalism advocates the preservation, restoration and improvement of the natural environment and critical earth system elements or processes such as the climate, and may be referred to as a movement to control pollution or protect plant and animal diversity. For this reason, concepts such as a land ethics, environmental ethics, biodiversity, ecology, and the biophilia hypothesis figure predominantly. The environmentalist movement encompasses various approaches to addressing environmental issues, including free market environmentalism, evangelical environmentalism, and the environmental conservation movement. At its crux, environmentalism is an attempt to balance relations between humans and the various natural systems on which they depend in such a way that all the components are accorded a proper degree of sustainability. The exact measures and outcomes of this balance is controversial and there are many different ways for environmental concerns to be expressed in practice. Environmentalism and environmental concerns are often represented by the colour green, but this association has been appropriated by the marketing industries for the tactic known as greenwashing. Environmentalism is opposed by anti-environmentalism, which says that the Earth is less fragile than some environmentalists maintain, and portrays environmentalism as overreacting to the human contribution to climate change or opposing human advancement§!"

 conservatism: "Conservatism"
 conservatism_noun: "Conservative"
 conservatism_desc: "Conservative Government\n§LConservatism is a cultural, social, and political philosophy and ideology that seeks to promote and preserve traditional institutions, customs, and values. The central tenets of conservatism may vary in relation to the culture and civilization in which it appears. In Western culture, depending on the particular nation and the particular time period, conservatives seek to promote and preserve a range of institutions, such as the nuclear family, organized religion, the military, the nation-state, constitution, property rights, rule of law, aristocracy, and monarchy. The 18th-century Anglo-Irish statesman Edmund Burke, who opposed the French Revolution but supported the American Revolution, is credited as one of the forefathers of Western conservative thought in the 1790s along with Savoyard statesman Joseph de Maistre. The first established use of the term in a political context originated in 1818 with François-René de Chateaubriand during the period of Bourbon Restoration that sought to roll back the policies of the French Revolution and establish social order. Conservatism has varied considerably as it has adapted itself to existing traditions and national cultures. Thus, conservatives from different parts of the world, each upholding their respective traditions, may disagree on a wide range of issues. One of the three major ideologies along with liberalism and socialism, conservatism is the dominant ideology in many countries across the world, including Hungary, India, Iran, Israel, Italy, Japan, Poland, and Russia. Historically associated with right-wing politics, the term has been used to describe a wide range of views. Conservatism may be either libertarian or authoritarian, populist or elitist, progressive or reactionary, moderate or extreme.§!"
 conservatives: "Conservative"
 conservatives_desc: "$conservatism_desc$"
 liberal_conservatives: "Liberal Conservative"
 liberal_conservatives_desc: "Liberal Conservative Government\n§LLiberal conservatism is a political ideology combining conservative policies with liberal stances, especially on economic issues but also on social and ethical matters, representing a brand of political conservatism strongly influenced by liberalism. The ideology incorporates the classical liberal view of minimal government intervention in the economy, according to which individuals should be free to participate in the market and generate wealth without government interference. However, liberal conservatives also hold that individuals cannot be thoroughly depended on to act responsibly in other spheres of life; therefore, they believe that a strong state is necessary to ensure law and order and that social institutions are needed to nurture a sense of duty and responsibility to the nation. Liberal conservatives also support civil liberties, and they differ on social issues; some are socially conservative and others socially liberal, though all liberal conservatives broadly support the rule of law regarding civil rights, social equality and the environment. This is equated with the creation of a cohesive and tolerant society with increased levels of individual responsibility and less inequality. Liberal conservatism shares the classical liberal tenets of a commitment to individualism, belief in negative freedom, a lightly regulated free market, and a minimal rule of law state. A number of commentators have stated that many conservative currents in the 1980s, such as Thatcherism, were rejuvenated classical liberals in all but name. However, in contrast to classical liberalism, there is a stronger social agenda and support for a greater degree of state intervention, especially in those areas of social life which liberal conservatives believe should not be subject to market forces. Particularly with regard to the family, sexuality, health and education, these should either always be periodically regulated or minimally protected by the state.§!"
 libertarian_conservatives: "Libertarian Conservative"
 libertarian_conservatives_desc: "Libertarian Conservative Government\n§LLibertarian conservatism, also referred to as conservative libertarianism: 49  and, more rarely, conservatarianism, is a libertarian political and social philosophy that combines conservatism and libertarianism, representing the libertarian wing of conservatism and vice versa. Libertarian conservatism advocates the greatest possible economic liberty and the least possible government regulation of social life (described as \"small government\"), mirroring laissez-faire classical liberalism, but harnesses this to a belief in a more socially conservative philosophy emphasizing authority, morality, and duty. Primarily an American ideology, libertarian conservatism prioritizes liberty, promoting free expression, freedom of choice and free-market capitalism to achieve conservative ends while rejecting liberal social engineering. Although having similarities to liberal conservatism and therefore mainstream American conservatism with both being influenced by classical liberal thought; libertarian conservatives are far more anti-statist and are much more hostile to government intervention in both social and economic matters.§!"
 national_conservatives: "National Conservative"
 national_conservatives_desc: "National Conservative Government\n§LNational conservatism is a variant of conservatism that prioritises the defense of national and cultural identity, often based on a theory of the family as a model for the state. It is oriented towards upholding national sovereignty, which includes opposing illegal immigration or immigration per se and having a strong military. National conservatism departs from economic liberalism and libertarianism and takes a more pragmatic approach to regulatory economics, national capitalism and protectionism. National conservatism opposes the basic precepts of enlightenment liberalism such as individualism and the universality of human rights, and in America and Europe, is majoritarian populist. National-conservative parties often have roots in rural environments, contrasting with the more urban support base of liberal-conservative parties. In Europe, some notable national conservatives parties include the Brothers of Italy, Fidesz and Reform UK. National conservatives usually embrace some form of Euroscepticism. In post-communist central and eastern Europe specifically, most conservative parties since 1989 have followed a national conservative ideology. Viktor Orbán in Hungary explicitly had his government fund national conservative institutions across Europe and the United States, such as the Danube Institute, the Mathias Corvinus Collegium, The European Conservative magazine, and the National Conservatism Conference§!"
 islamist_conservatives: "Islamist Conservative"
 islamist_conservatives_desc: "Islamist Conservative Government\n§LIslamic fundamentalism has been defined as a revivalist and reform movement of Muslims who aim to return to the founding scriptures of Islam. The term has been used interchangeably with similar terms such as Islamism, Islamic revivalism, the Salafi movement, Qutbism, Islamic activism, among others, and has been criticized as pejorative. Some of the beliefs attributed to Islamic fundamentalists are that the primary sources of Islam (the Quran, Hadith, and Sunnah), should be interpreted in a literal and originalist way; that corrupting non-Islamic influences should be eliminated from every part of Muslims' lives; and that the societies, economies, and governance of Muslim-majority countries should return to the fundamentals of Islam, the system of Islam, and become Islamic states§!"
 green_conservatives: "Green Conservative"
 green_conservatives_desc: "Green Conservative Government\n§LGreen conservatism is a combination of conservatism with environmentalism. Environmental concern has been voiced by both conservative politicians and philosophers throughout the history of conservatism. A feature of green conservatism is a stress on market-based policies to address environmental concerns, rather than mere centralised planning. Individual and local empowerment is preferred over top down control. Where solutions to problems are global, such as climate change, green conservatives believe the government's role \"is to empower individuals, entrepreneurs, and philanthropists to collaborate and come up with innovations that will solve climate change\". Green conservatives often embrace the principles of bright green environmentalism.§!"

 populism: "Populism"
 populism_noun: "Populist"
 populism_desc: "Populist Government\n§LPopulism is a contested concept for a variety of political stances that emphasise the idea of the \"common people\", often in opposition to a perceived elite. It is frequently associated with anti-establishment and anti-political sentiment. The term developed in the late 19th century and has been applied to various politicians, parties, and movements since that time, often assuming a pejorative tone. Within political science and other social sciences, different definitions of populism have been employed.§!"
 populist: "Populist"
 populist_desc: "$populism_desc$"
 national_populist: "National Populist"
 national_populist_desc: "National Populist Government\n§LRight-wing populism, also called right populism and national populism, is a political ideology that combines right-wing politics with populist rhetoric and themes. Its rhetoric employs anti-elitist sentiments, opposition to the Establishment, and speaking to or for the common people. Recurring themes of this political ideology include neo-nationalism, social conservatism, economic nationalism, and fiscal conservatism. Frequently they aim to defend a national culture, identity, and economy against perceived attacks by outsiders. Some right-wing populist parties and movements have associations with elements of authoritarianism, while some far-right populists draw comparisons to fascism. Right-wing populism in the Western world is sometimes associated with ideologies such as anti-environmentalism, anti-globalisation, nativism, and protectionism. In Europe, the term is often used to describe groups, politicians and political parties generally known for their opposition to immigration, and for Euroscepticism. Some right-wing populists may support expanding the welfare state, but only for those they deem fit to receive it; this concept has been referred to as "welfare chauvinism". Since the Great Recession, European right-wing populist movements began to grow in popularity, in large part due to increasing opposition to immigration from the Middle East and Africa, rising Euroscepticism and discontent with the economic policies of the European Union. Some forms of right-wing populism may also go into libertarian themes, with federalism, anti-central bank, pro-sound money and the non-aggression principle being key themes in the libertarian spectre of right-wing populism, with Ron Paul and some parts of the Tea Party movement being a notable example of this. From the 1990s, right-wing populist parties became established in the legislatures of various democracies. Right-wing populism has remained the dominant political force in the Republican Party in the United States since the 2010s. Although extreme right-wing movements in the United States (where they are normally referred to as the "radical right") are usually characterised as separate entities, some writers consider them to be a part of a broader, right-wing populist phenomenon. Donald Trump, an American businessman and media personality, won the 2016 and 2024 United States presidential elections after running on platforms founded on right-wing populist themes, which his ideology is built upon.§!"
 christian_populist: "Christian populist"
 christian_populist_desc: "Christian Populist Government\n§LChristian Populism uses the ideals of Christianity to unify a \"common people\", followed by populistic promises and policies.§!"
 sunni_populist: "Sunni populist"
 sunni_populist_desc: "Sunni Populist Government\n§LSunni Populism uses the ideals of Sunni-Islam to unify a \"common people\", followed by populistic promises and policies.§!"
 shia_populist: "Shia populist"
 shia_populist_desc: "Shia Populist Government\n§LShia Populism uses the ideals of Shi-Islam to unify a \"common people\", followed by populistic promises and policies.§!"
 oligarchy: "Oligarchic"
 oligarchy_desc: "Oligarchic Government\n§LOligarchism is an ideology that favours oligarchies, either through corporatistic means or through total governmental control by a few wealthy individuals.!"

 nationalism: "Nationalism"
 nationalism_noun: "Nationalist"
 nationalism_desc: "Nationalist Government\n§LSignified in the ideals of a nation state. Where a singular nationality holds superiority over others.§!"
 nationalist: "Nationalist"
 nationalist_desc: "$nationalism_desc$"
 nazi: "Nazi"
 nazi_desc: "Nazi Government\n§LNational Socialism, commonly known as Nazism is the far-right, ultranationalist, racist, totalitarian ideology associated with Adolf Hitler and the Nazi Party (NSDAP). It emerged in Germany during Hitler's rise to power and was frequently called Hitlerism. Nazism is a form of fascism that emphasizes pseudo-scientific theories of racial hierarchy which identify ethnic Germans and Nordic Aryans as a master race. Nazism opposes liberal democracy and the parliamentary system. It advocates dictatorship, fervent antisemitism, anti-communism, anti-Slavism, anti-Romani sentiment, scientific racism, white supremacy, Nordicism, social Darwinism, homophobia, ableism, and eugenics. They seek to overcome social divisions and create a homogeneous national society based on racial purity. With aims to unite all of their nationality living in historical territory and gain lands for expansion, and exclude those deemed either Community Aliens or \"inferior races\".\nWhilst the name includes Socialism, the ideology does not push for any other parts of socialism, instead the naming comes from two fronts. First being Adolf Hitler, who himself stated \"Socialism, is the science of dealing with the common weal. Communism is not Socialism. Marxism is not Socialism. The Marxians have stolen the term and confused its meaning. I shall take Socialism away from the Socialists. Socialism is an ancient Aryan, Germanic institution  We demand the fulfilment of the just claims of the productive classes by the state on the basis of race solidarity. To us state and race are one\". He also signified in \"Mein Kampf\"(My Fight) that adding socialism to the ideology was also to attract working class people.§!"
 neo_nazi: "Neo-Nazi"
 neo_nazi_desc: "Neo-Nazi Government\n§LNeo-Nazism comprises all social, political, and militant ideologies and movements that have professed or idealized Nazism, whether in whole or in part, since the end of World War II in 1945. Neo-Nazi individuals and organizations employ their ideology to promote what they perceive as the racial or ethnic supremacy (often White supremacy) of their own group; to incite or engage in hatred or discrimination against demographic minorities (often antisemitism and Islamophobia); and, in some cases, to establish a fascist state (e.g., \"Fourth Reich\"). Also common in neo-Nazi circles is engagement in historical negationism and propagation of conspiracy theories—not limited to absolving or glorifying the Nazi Party or those who inspired or are thought to have inspired Adolf Hitler and other prominent Nazi figures—such as Holocaust denial and Jewish war; White genocide and Great Replacement; and \"cultural\" Marxism. While mainly concentrated in the Western world, neo-Nazism is a global phenomenon and has organized representation in several international networks. However, it is not exclusive to people of European origin—many similar supremacist movements among local racial or ethnic groups in non-Western regions have been observed adhering to tenets of or inspired by neo-Nazi ideology. Much of this manifests in adopting original Nazi ideological doctrine and practices, including racism, ultra-nationalism, ableism, homophobia, and conspiratorial anti-communism, among others. Neo-Nazis regularly display Nazi symbols and express admiration for the actions of Hitler's Germany before and during World War II. In a number of Western and non-Western countries (and especially in Germany), neo-Nazism is prohibited by laws specifically targeting Nazi ideology, in addition to general laws against hatred and discrimination. Likewise, among these countries, Nazi-related symbols are also banned as part of a long-running effort of de-Nazification that began with the Allies of World War II.§!"
 fascist: "Fascist"
 fascist_desc: "Fascist Government\n§LIs an ideology that is difficult to truly define. During it's history it has taken a multitude of forms; from Mussolini's inital \"Partito Nazionale Fascista\" to the Fransico Franco's Falangism to Augusto Pinochet's Chile.\nHowever there are some core tenents to fascism that are agreed upon:\n1: Ultranationalism, combined with the myth of national rebirth is a key part of fascism. Uniting either a nationality or a race under one nation state.\n2: Totalitarianism, it rejects democracy in all forms, believeing in either a true autocractic dictatorship or a one party state.\n3: Economic policy is a tenent that changes parts but never truly between movements. State control of industry, oligarchy and social-darwinism, the belief that the weak should be removed and that welfare should be destroyed.\n4: Direct action, fascism believes in taking direct and active action using militarist means. Wheter that be through conquest or purging \"weak\" populations.§!"
 zionist: "Zionist"
 zionist_desc: "Zionist Government\n§LZionism is an ethnic nationalist movement that emerged in late 19th-century Europe to establish and support a Jewish homeland through colonization in the region of Palestine, which roughly corresponds to the Land of Israel in Judaism—itself central to Jewish history. Zionists wanted to create a Jewish state in Palestine with as much land, as many Jews, and as few Palestinian Arabs as possible. Zionism was the main force behind the creation of the State of Israel in 1948, and remains the country's dominant ideology today. Zionism initially emerged in Central and Eastern Europe as a secular nationalist movement in the late 19th century, in reaction to new waves of antisemitism and in response to the Haskalah, or Jewish Enlightenment. By the beginning of the 20th century, the Zionist movement, led by Theodor Herzl, associated this national revival with lands in Palestine, a region then under Ottoman rule. The arrival of Zionist settlers in Palestine during this period is widely seen as marking the start of the Israeli–Palestinian conflict. The Zionist claim to Palestine was based on the notion that the Jews' historical right to the land outweighed that of the Arabs.§!"
 jihadist: "Jihadists"
 jihadist_desc: "Jihadist Government\n§LJihadism is the ideology of modern, armed militant Islamic movements that seek to establish states based on Islamic principles. In a narrower sense, it refers to the belief that armed confrontation is an efficient and theologically legitimate method of sociopolitical change towards an Islamic system of governance. The term \"jihadism\" has been applied to various Islamic extremist and/or Islamist individuals and organizations with militant ideologies based on the classical Islamic notion of lesser jihad.§!"
 ecofascist: "Ecofascism"
 ecofascist_desc: "Ecofascism Government\n§LEcofascism, sometimes spelled eco-fascism, is a term used to describe individuals and groups which combine environmentalism with fascism. In older literature, eco-fascism was viewed as a hypothetical form of totalitarianism based on environmentalism. Since the 2010s, a number of individuals and groups have emerged that either self-identify as \"ecofascist\" or have been labelled as \"ecofascist\" by academic and journalistic sources. These individuals and groups synthesise radical far-right politics with environmentalism; they will typically argue that overpopulation is the primary threat to the environment and that the only solution is a complete halt to immigration or, at their most extreme, genocide against various groups and ethnicities. Many far-right political parties have added green politics to their platforms. Through the 2010s, ecofascism has also seen increasing support, and subsequently has seen increasing interest from researchers.§!"

 autocracy: "Autocracy"
 autocracy_noun: "Autocratic"
 autocracy_desc: "Autocratic Government\n§LAutocracy is a form of government in which absolute power is held by one person, known as an autocrat. It includes both absolute monarchies and dictatorships, while it is contrasted with democracy and other forms of free government. The autocrat has total control over the exercise of civil liberties within the autocracy, choosing under what circumstances they may be exercised, if at all. Governments may also blend elements of autocracy and democracy, forming a mixed type of regime sometimes referred to as anocracy, hybrid regime, or electoral autocracy. The concept of autocracy has been recognized in political philosophy since ancient history.§!"
 autocrat: "Autocratic"
 autocrat_desc: "Autocratic Government"
 caliphate: "Caliphate"
 caliphate_desc: "Caliphate\n§LA caliphate is an institution or public office under the leadership of an Islamic steward with the title of caliph (/ˈkælɪf, ˈkeɪ-/), a person considered a political–religious successor to the Islamic prophet Muhammad and a leader of the entire Muslim world (ummah). Historically, the caliphates were polities based on Islam which developed into multi-ethnic trans-national empires.§!"
 monarchy: "Monarchist"
 monarchy_desc: "Monarchy\n§LIs a form of government in which the sovereign is the sole source of political power, unconstrained by constitutions, legislatures or other checks on their authority. Throughout history, there have been many examples of absolute monarchs, with some famous examples including Louis XIV, Frederick the Great and Abdulaziz bin Abdu Rahman Al Saud.§!"
 theocracy: "Theocratic"
 theocracy_desc: "Theocratic Government\n§LTheocracy is a form of government in which one or more deities are recognized as supreme ruling authorities giving divine guidance to human intermediaries with executive, legislative or judicial power who manage the government's daily affairs. A famous example is the Holy see of the Pope. Which is ruled under the law of god through the Pope.§!"
